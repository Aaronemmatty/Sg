version: "3.9"

services:
  # ── Auth Service ───────────────────────────────────────────────────────────
  auth:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    container_name: sg_auth
    restart: unless-stopped
    ports:
      - "8001:8001"
    environment:
      APP_ENV: development
      DEBUG: "true"
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY required}
      JWT_ALGORITHM: RS256
      JWT_PRIVATE_KEY: ${JWT_PRIVATE_KEY:?JWT_PRIVATE_KEY required}
      JWT_PUBLIC_KEY: ${JWT_PUBLIC_KEY:?JWT_PUBLIC_KEY required}
      DATABASE_URL: postgresql+asyncpg://sg:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/sg_platform
      REDIS_URL: redis://redis:6379/0
      EMAIL_VERIFICATION_REQUIRED: "false"
      DEVICE_TRACKING_ENABLED: "true"
      PROMETHEUS_ENABLED: "true"
      LOG_LEVEL: DEBUG
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - sg_network
    volumes:
      - ./app:/app/app:ro   # hot-reload in dev

  # ── PostgreSQL ─────────────────────────────────────────────────────────────
  postgres:
    image: postgres:17-alpine
    container_name: sg_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: sg
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: sg_platform
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sg -d sg_platform"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - sg_network

  # ── Redis ──────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: sg_redis
    restart: unless-stopped
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru --requirepass ${REDIS_PASSWORD:-redispass}
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - sg_network

  # ── Migration runner (one-shot) ────────────────────────────────────────────
  migrate:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    container_name: sg_migrate
    command: alembic upgrade head
    environment:
      DATABASE_URL: postgresql+asyncpg://sg:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/sg_platform
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - sg_network
    profiles:
      - migrate   # run with: docker compose --profile migrate up migrate

volumes:
  pg_data:
  redis_data:

networks:
  sg_network:
    driver: bridge
