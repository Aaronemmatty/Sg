version: "3.9"

services:
  market-data:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    container_name: sg_market_data
    restart: unless-stopped
    ports:
      - "8002:8002"
    environment:
      APP_ENV: development
      DEBUG: "false"
      KITE_API_KEY: ${KITE_API_KEY:?required}
      KITE_API_SECRET: ${KITE_API_SECRET:?required}
      KITE_ACCESS_TOKEN: ${KITE_ACCESS_TOKEN:?required}
      # Set to "mock" for offline development
      KITE_MODE: ${KITE_MODE:-live}
      DATABASE_URL: postgresql+asyncpg://sg:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/sg_platform
      REDIS_URL: redis://redis:6379/1
      YAHOO_ENABLED: "true"
      CLICKHOUSE_ENABLED: "false"
      PROMETHEUS_ENABLED: "true"
      LOG_LEVEL: INFO
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - sg_network

  postgres:
    image: postgres:17-alpine
    container_name: sg_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: sg
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: sg_platform
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sg -d sg_platform"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - sg_network

  redis:
    image: redis:7-alpine
    container_name: sg_redis
    restart: unless-stopped
    command: redis-server --maxmemory 512mb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - sg_network

volumes:
  pg_data:
  redis_data:

networks:
  sg_network:
    driver: bridge
