apiVersion: 1

providers:
  - name: infra
    folder: "Infra"
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    options:
      path: /var/lib/grafana/dashboards/infra
      foldersFromFilesStructure: false

  - name: domain
    folder: "Trading Domain"
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    options:
      path: /var/lib/grafana/dashboards/domain
      foldersFromFilesStructure: false
