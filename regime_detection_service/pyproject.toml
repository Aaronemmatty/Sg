[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sg-regime-detection-service"
version = "1.0.0"
description = "Market Regime Detection Engine — SG Trading Platform"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.2",
    "pydantic-settings>=2.5.2",
    "sqlalchemy[asyncio]>=2.0.35",
    "asyncpg>=0.30.0",
    "alembic>=1.13.3",
    "redis>=5.0.8",
    "httpx>=0.27.2",
    "structlog>=24.4.0",
    "prometheus-client>=0.21.0",
    "pandas>=2.2.3",
    "numpy>=2.1.0",
    "scikit-learn>=1.5.0",
    "joblib>=1.4.0",
    "pyjwt>=2.9.0",
    "cryptography>=43.0.0",
    "sg-db",
    "sg-security",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-mock>=3.14.0",
    "fakeredis>=2.25.0",
    "aiosqlite>=0.20.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.hatch.metadata]
allow-direct-references = true
