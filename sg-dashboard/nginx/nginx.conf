upstream dashboard {
    server dashboard:3000;
}

upstream auth_service      { server auth_service:8001; }
upstream market_data       { server market_data_service:8002; }
upstream broker_service    { server broker_service:8003; }
upstream strategy_service  { server strategy_service:8004; }
upstream regime_service    { server regime_detection_service:8005; }
upstream orchestrator      { server execution_orchestrator_service:8006; }
upstream risk_engine       { server risk_engine_service:8007; }
upstream execution_engine  { server execution_engine_service:8008; }
upstream portfolio_mgmt    { server portfolio_management_service:8009; }
upstream backtesting       { server backtesting_engine:8010; }
upstream ml_platform       { server ml_platform_service:8011; }
upstream ai_analyst        { server ai_analyst_service:8012; }

server {
    listen 80;
    server_name _;
    client_max_body_size 10M;

    # SSE: disable buffering for all event-stream responses
    proxy_buffering off;
    proxy_cache off;

    # Dashboard (Next.js)
    location / {
        proxy_pass http://dashboard;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_cache_bypass $http_upgrade;
    }

    # SSE streams — long timeout, no buffering
    location ~* /stream$ {
        proxy_pass http://dashboard;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_read_timeout 3600s;
        proxy_buffering off;
        proxy_cache off;
        add_header X-Accel-Buffering no;
    }

    # Direct service SSE passthrough (browser → nginx → service)
    location /sse/portfolio/ {
        proxy_pass http://portfolio_mgmt/api/v1/portfolio/stream;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_read_timeout 3600s;
        proxy_buffering off;
    }

    location /sse/risk/ {
        proxy_pass http://risk_engine/api/v1/risk/stream;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_read_timeout 3600s;
        proxy_buffering off;
    }

    location /sse/execution/ {
        proxy_pass http://execution_engine/api/v1/execution/stream;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_read_timeout 3600s;
        proxy_buffering off;
    }
}
