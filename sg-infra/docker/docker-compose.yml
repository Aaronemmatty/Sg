# ═══════════════════════════════════════════════════════════════════════════
# SG Trading Platform — Master Docker Compose
# ═══════════════════════════════════════════════════════════════════════════
# Single-file, one-command startup for every platform component:
#   infra (Postgres/Redis/MLflow) + 13 platform services + dashboard + nginx
#   + full observability stack (Prometheus/Grafana/Loki/Promtail/Tempo/
#   Alertmanager/OTel Collector, merged in from observability_service/).
#
# USAGE (prefer the `sg` wrapper script — it sets -p/--env-file for you):
#   ./sg up                                   # start everything
#   ./sg up auth_service market_data_service  # start a subset
#   ./sg logs market_data_service
#   ./sg down                                 # stop (volumes preserved)
#
# Raw compose equivalent:
#   docker compose -p sg_blue -f docker/docker-compose.yml --env-file .env up -d
#
# ─── BLUE/GREEN NOTES (see docs/STARTUP_ORDER.md + docs/DEPLOYMENT_NOTES.md)──
#   This file is invoked under TWO possible project names: sg_blue / sg_green
#   (set via `docker compose -p`). Infra + observability + nginx are
#   SINGLETON services — they run once, under whichever project started them
#   first, and are intentionally excluded from blue/green swaps (see
#   scripts/blue_green_deploy.sh APP_SERVICES list). Only the 13 platform
#   services + dashboard are duplicated per-slot. This file uses
#   ${COMPOSE_PROJECT_NAME} interpolation so each slot's app containers and
#   internal URLs are slot-scoped (sg_blue_auth_service vs sg_green_auth_
#   service) without colliding, while both slots still share the same
#   Postgres/Redis/MLflow data via the external `sg_network` and fixed
#   (non-project-scoped) volume names below.
#
#   Network is declared `external: true` for this exact reason: Compose
#   namespaces a non-external network per project, which would make
#   sg_blue's containers invisible to sg_green's and to nginx/observability.
#   `./sg up` creates the network automatically if it doesn't exist yet.
# ═══════════════════════════════════════════════════════════════════════════

networks:
  sg_network:
    name: sg_network
    external: true

volumes:
  pg_data:           { name: sg_pg_data }
  redis_data:        { name: sg_redis_data }
  mlflow_data:       { name: sg_mlflow_data }
  prometheus_data:   { name: sg_prometheus_data }
  grafana_data:      { name: sg_grafana_data }
  loki_data:         { name: sg_loki_data }
  tempo_data:        { name: sg_tempo_data }
  alertmanager_data: { name: sg_alertmanager_data }

# ─── Shared defaults ──────────────────────────────────────────────────────
x-service-defaults: &service-defaults
  restart: unless-stopped
  networks: [sg_network]
  logging:
    driver: json-file
    options:
      max-size: "50m"
      max-file: "5"

# Platform services ship without curl in their runtime images (verified
# against every Dockerfile in this repo — none of the 13 services apt-get
# installs curl in the final stage). The literal `curl -f .../health`
# healthcheck the spec asks for would therefore fail with "executable file
# not found" on every single service. python3 + urllib IS guaranteed (it's
# the interpreter running the app), and is exactly the pattern auth_service,
# market_data_service, broker_service, regime_detection_service and
# signal_aggregation_service already bake into their own Dockerfile
# HEALTHCHECK lines — so this anchor standardizes on that proven approach
# instead. See docs/DEPLOYMENT_NOTES.md "Healthcheck mechanism" for the full
# write-up and the alternative (add curl to each Dockerfile) if you'd rather
# have literal curl semantics.
x-py-healthcheck: &py-healthcheck
  interval: 30s
  timeout: 10s
  retries: 3
  start_period: 40s

services:

  # ═══════════════════════════════════════════════════════════════════════
  # INFRASTRUCTURE (singleton — never duplicated across blue/green slots)
  # ═══════════════════════════════════════════════════════════════════════

  postgres:
    <<: *service-defaults
    image: postgres:17-alpine
    container_name: sg_postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sg_db}
      POSTGRES_USER: ${POSTGRES_USER:-sg_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./postgres/postgresql.conf:/etc/postgresql/postgresql.conf:ro
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      <<: *py-healthcheck
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sg_user} -d ${POSTGRES_DB:-sg_db}"]
      start_period: 20s

  redis:
    <<: *service-defaults
    image: redis:7.4-alpine
    container_name: sg_redis
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
      --appendonly yes
      --appendfsync everysec
    volumes:
      - redis_data:/data
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      <<: *py-healthcheck
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "--no-auth-warning", "ping"]
      start_period: 10s

  mlflow:
    <<: *service-defaults
    image: ghcr.io/mlflow/mlflow:v2.17.0
    container_name: sg_mlflow
    entrypoint: ["bash", "-c"]
    command:
      - |
        pip install --no-cache-dir psycopg[binary] >/dev/null 2>&1
        mlflow server \
          --backend-store-uri postgresql+psycopg://${POSTGRES_USER:-sg_user}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-sg_db} \
          --default-artifact-root /mlflow/artifacts \
          --host 0.0.0.0 --port 5000
    volumes:
      - mlflow_data:/mlflow/artifacts
    ports:
      - "127.0.0.1:5000:5000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      <<: *py-healthcheck
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health')"]
      start_period: 30s

  # One-shot core-schema migration (shared `database` package — tenants,
  # users, roles, portfolios, etc.). Run explicitly: `./sg migrate`.
  # NOTE: several services also ship their OWN alembic dirs / sql/ folders
  # (auth_service, execution_orchestrator_service, regime_detection_service,
  # signal_aggregation_service use alembic; risk_engine_service ships raw
  # .sql files; ml_platform_service ships no migration tooling at all in its
  # Dockerfile). This one-shot only covers the shared core schema — see
  # docs/DEPLOYMENT_NOTES.md "Migrations" for the full per-service status
  # and what we recommend you verify before going live.
  migrate:
    image: python:3.12-slim
    container_name: sg_migrate
    working_dir: /app
    volumes:
      - ../../database:/app:ro
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-sg_user}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-sg_db}
    command: ["sh", "-c", "pip install --no-cache-dir . >/dev/null && alembic upgrade head"]
    depends_on:
      postgres:
        condition: service_healthy
    networks: [sg_network]
    profiles: ["migrate"]

  # ═══════════════════════════════════════════════════════════════════════
  # PLATFORM SERVICES (13 — blue/green-scoped via ${COMPOSE_PROJECT_NAME})
  # ═══════════════════════════════════════════════════════════════════════

  auth_service:
    <<: *service-defaults
    build: { context: ../.., dockerfile: auth_service/Dockerfile, target: runtime }
    image: sg/auth_service:${VERSION:-latest}
    container_name: ${COMPOSE_PROJECT_NAME}_auth_service
    environment:
      APP_ENV: ${SERVICE_ENV:-production}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY required}
      JWT_ALGORITHM: RS256
      JWT_PRIVATE_KEY: ${JWT_PRIVATE_KEY:?JWT_PRIVATE_KEY required}
      JWT_PUBLIC_KEY: ${JWT_PUBLIC_KEY:?JWT_PUBLIC_KEY required}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-15}
      REFRESH_TOKEN_EXPIRE_DAYS: ${REFRESH_TOKEN_EXPIRE_DAYS:-30}
      MAX_LOGIN_ATTEMPTS: ${MAX_LOGIN_ATTEMPTS:-5}
      LOCKOUT_DURATION_MINUTES: ${LOCKOUT_DURATION_MINUTES:-15}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-sg_user}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-sg_db}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      SENDGRID_API_KEY: ${SENDGRID_API_KEY:-}
      EMAIL_FROM: ${EMAIL_FROM:-noreply@sg-trading.local}
      EMAIL_FROM_NAME: ${EMAIL_FROM_NAME:-SG Trading Platform}
      MFA_REQUIRED: ${MFA_REQUIRED:-false}
      EMAIL_VERIFICATION_REQUIRED: ${EMAIL_VERIFICATION_REQUIRED:-false}
      DEVICE_TRACKING_ENABLED: "true"
      PROMETHEUS_ENABLED: "true"
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      OTEL_SERVICE_NAME: auth_service
    ports: ["127.0.0.1:8001:8001"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck:
      <<: *py-healthcheck
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')"]

  market_data_service:
    <<: *service-defaults
    build: { context: ../.., dockerfile: market_data_service/Dockerfile }
    image: sg/market_data_service:${VERSION:-latest}
    container_name: ${COMPOSE_PROJECT_NAME}_market_data_service
    environment:
      APP_ENV: ${SERVICE_ENV:-production}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-sg_user}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-sg_db}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/1
      KITE_API_KEY: ${KITE_API_KEY:-}
      KITE_API_SECRET: ${KITE_API_SECRET:-}
      KITE_ACCESS_TOKEN: ${KITE_ACCESS_TOKEN:-}
      KITE_MODE: ${KITE_MODE:-mock}
      YAHOO_ENABLED: "true"
      CLICKHOUSE_ENABLED: "false"
      ALLOWED_ORIGINS: http://localhost
      PROMETHEUS_ENABLED: "true"
      AUTH_SERVICE_URL: http://${COMPOSE_PROJECT_NAME}_auth_service:8001
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      OTEL_SERVICE_NAME: market_data_service
    ports: ["127.0.0.1:8002:8002"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      auth_service: { condition: service_healthy }
    healthcheck:
      <<: *py-healthcheck
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8002/health')"]

  broker_service:
    <<: *service-defaults
    build: { context: ../.., dockerfile: broker_service/Dockerfile }
    image: sg/broker_service:${VERSION:-latest}
    container_name: ${COMPOSE_PROJECT_NAME}_broker_service
    environment:
      APP_ENV: ${SERVICE_ENV:-production}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      BROKER_MODE: ${BROKER_MODE:-paper}
      KITE_API_KEY: ${KITE_API_KEY:-}
      KITE_API_SECRET: ${KITE_API_SECRET:-}
      KITE_ACCESS_TOKEN: ${KITE_ACCESS_TOKEN:-}
      MAX_ORDER_VALUE_INR: ${MAX_ORDER_VALUE_INR:-500000}
      MAX_POSITION_VALUE_INR: ${MAX_POSITION_VALUE_INR:-2000000}
      MAX_DAILY_LOSS_INR: ${MAX_DAILY_LOSS_INR:-50000}
      MAX_ORDERS_PER_SYMBOL_PER_DAY: ${MAX_ORDERS_PER_SYMBOL_PER_DAY:-50}
      PAPER_INITIAL_CAPITAL_INR: ${PAPER_INITIAL_CAPITAL_INR:-1000000}
      PAPER_SLIPPAGE_PCT: ${PAPER_SLIPPAGE_PCT:-0.05}
      PAPER_FILL_DELAY_MS: ${PAPER_FILL_DELAY_MS:-100}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-sg_user}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-sg_db}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/2
      MARKET_DATA_SERVICE_URL: http://${COMPOSE_PROJECT_NAME}_market_data_service:8002
      AUTH_SERVICE_URL: http://${COMPOSE_PROJECT_NAME}_auth_service:8001
      ALLOWED_ORIGINS: http://localhost
      PROMETHEUS_ENABLED: "true"
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      OTEL_SERVICE_NAME: broker_service
    ports: ["127.0.0.1:8003:8003"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      auth_service: { condition: service_healthy }
      market_data_service: { condition: service_healthy }
    healthcheck:
      <<: *py-healthcheck
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8003/health')"]

  strategy_service:
    <<: *service-defaults
    build: { context: ../.., dockerfile: strategy_service/Dockerfile }
    image: sg/strategy_service:${VERSION:-latest}
    container_name: ${COMPOSE_PROJECT_NAME}_strategy_service
    environment:
      APP_ENV: ${SERVICE_ENV:-production}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      TRADING_MODE: ${TRADING_MODE:-paper}
      USER_STRATEGIES_DIR: /app/strategies
      STRATEGY_EXECUTION_TIMEOUT_S: ${STRATEGY_EXECUTION_TIMEOUT_S:-5.0}
      STRATEGY_MAX_RESTARTS: ${STRATEGY_MAX_RESTARTS:-5}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-sg_user}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-sg_db}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/3
      MARKET_DATA_SERVICE_URL: http://${COMPOSE_PROJECT_NAME}_market_data_service:8002
      AUTH_SERVICE_URL: http://${COMPOSE_PROJECT_NAME}_auth_service:8001
      ALLOWED_ORIGINS: http://localhost
      PROMETHEUS_ENABLED: "true"
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      OTEL_SERVICE_NAME: strategy_service
    volumes:
      - ../../strategy_service/strategies:/app/strategies
    ports: ["127.0.0.1:8004:8004"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      auth_service: { condition: service_healthy }
      market_data_service: { condition: service_healthy }
    healthcheck:
      <<: *py-healthcheck
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8004/health')"]

  regime_detection_service:
    <<: *service-defaults
    build: { context: ../.., dockerfile: regime_detection_service/Dockerfile }
    image: sg/regime_detection_service:${VERSION:-latest}
    container_name: ${COMPOSE_PROJECT_NAME}_regime_detection_service
    environment:
      SERVICE_NAME: regime_detection_service
      SERVICE_PORT: "8005"
      ENV: ${SERVICE_ENV:-production}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      DEFAULT_TENANT_ID: ${DEFAULT_TENANT_ID:-00000000-0000-0000-0000-000000000001}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-sg_user}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-sg_db}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/4
      MARKET_DATA_SERVICE_URL: http://${COMPOSE_PROJECT_NAME}_market_data_service:8002
      PRIMARY_SYMBOL: ${PRIMARY_SYMBOL:-NIFTY50}
      PRIMARY_EXCHANGE: NSE
      DEFAULT_TIMEFRAME: ${DEFAULT_TIMEFRAME:-5m}
      WATCHLIST_SYMBOLS: ${WATCHLIST_SYMBOLS:-RELIANCE,HDFCBANK,ICICIBANK,INFY,TCS,TATAMOTORS,SBIN,ITC,LT,AXISBANK}
      VIX_SYMBOL: INDIAVIX
      MIN_CONFIDENCE_FOR_TRANSITION: 0.55
      PER_SYMBOL_DIVERGENCE_THRESHOLD: 0.6
      RECALC_INTERVAL_SECONDS: 300
      TRANSITION_CONFIRM_BARS: 2
      AUTH_REQUIRED: "true"
      JWT_PUBLIC_KEY_PATH: /run/secrets/auth_public_key.pem
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      OTEL_SERVICE_NAME: regime_detection_service
    secrets:
      - source: auth_public_key
        target: auth_public_key.pem
    ports: ["127.0.0.1:8005:8005"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      auth_service: { condition: service_healthy }
      market_data_service: { condition: service_healthy }
    healthcheck:
      <<: *py-healthcheck
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8005/health')"]

  execution_orchestrator_service:
    <<: *service-defaults
    build: { context: ../.., dockerfile: execution_orchestrator_service/Dockerfile }
    image: sg/execution_orchestrator_service:${VERSION:-latest}
    container_name: ${COMPOSE_PROJECT_NAME}_execution_orchestrator_service
    environment:
      APP_ENV: ${SERVICE_ENV:-production}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      HOST: 0.0.0.0
      PORT: "8006"
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-sg_user}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-sg_db}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/5
      BROKER_SERVICE_URL: http://${COMPOSE_PROJECT_NAME}_broker_service:8003
      RISK_ENGINE_URL: http://${COMPOSE_PROJECT_NAME}_risk_engine_service:8007
      AUTH_SERVICE_URL: http://${COMPOSE_PROJECT_NAME}_auth_service:8001
      MIN_CONFIDENCE: 0.60
      MIN_LIQUIDITY_VALUE_INR: 100000.0
      MAX_POSITION_PCT: 0.10
      MAX_SECTOR_EXPOSURE_PCT: 0.30
      MAX_CORRELATION_SCORE: 0.80
      DEFAULT_RISK_PCT: 1.0
      MAX_ALLOCATION_INR: ${MAX_ALLOCATION_INR:-500000.0}
      MIN_ALLOCATION_INR: 1000.0
      DAILY_LOSS_LIMIT_INR: ${MAX_DAILY_LOSS_INR:-50000.0}
      DAILY_LOSS_LIMIT_PCT: 0.05
      MAX_PORTFOLIO_DRAWDOWN_PCT: 0.15
      MAX_OPEN_INTENTS: 20
      PROMETHEUS_ENABLED: "true"
      ALLOWED_ORIGINS: http://localhost
      AUDIT_LOG_ENABLED: "true"
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      OTEL_SERVICE_NAME: execution-orchestrator
    ports: ["127.0.0.1:8006:8006"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      auth_service: { condition: service_healthy }
    healthcheck:
      <<: *py-healthcheck
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8006/health')"]

  risk_engine_service:
    <<: *service-defaults
    build: { context: ../.., dockerfile: risk_engine_service/Dockerfile }
    image: sg/risk_engine_service:${VERSION:-latest}
    container_name: ${COMPOSE_PROJECT_NAME}_risk_engine_service
    environment:
      SERVICE_NAME: risk_engine_service
      SERVICE_PORT: "8007"
      ENV: ${SERVICE_ENV:-production}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      POSTGRES_DSN: postgresql://${POSTGRES_USER:-sg_user}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-sg_db}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/6
      BROKER_SERVICE_URL: http://${COMPOSE_PROJECT_NAME}_broker_service:8003
      MARKET_DATA_SERVICE_URL: http://${COMPOSE_PROJECT_NAME}_market_data_service:8002
      EXECUTION_ORCHESTRATOR_URL: http://${COMPOSE_PROJECT_NAME}_execution_orchestrator_service:8006
      AUTH_SERVICE_URL: http://${COMPOSE_PROJECT_NAME}_auth_service:8001
      AUTH_JWT_PUBLIC_KEY_PATH: /run/secrets/jwt_public_key.pem
      MARGIN_CHECK_MODE: resilient
      MARGIN_CACHE_TTL_SECONDS: 30
      VAR_METHOD: parametric
      VAR_CONFIDENCE: 0.95
      VAR_HORIZON_DAYS: 1
      KILL_SWITCH_AUTO_RESET_REQUIRES_ROLE: risk_officer
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      OTEL_SERVICE_NAME: risk_engine_service
    secrets:
      - source: auth_public_key
        target: jwt_public_key.pem
    ports: ["127.0.0.1:8007:8007"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      auth_service: { condition: service_healthy }
    healthcheck:
      <<: *py-healthcheck
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8007/health')"]

  execution_engine_service:
    <<: *service-defaults
    build: { context: ../.., dockerfile: execution_engine_service/Dockerfile }
    image: sg/execution_engine_service:${VERSION:-latest}
    container_name: ${COMPOSE_PROJECT_NAME}_execution_engine_service
    environment:
      ENV: ${SERVICE_ENV:-production}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      SERVICE_PORT: "8008"
      DATABASE_URL: postgresql://${POSTGRES_USER:-sg_user}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-sg_db}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/7
      REDIS_RISK_APPROVED_PATTERN: "sg:risk_approved:*"
      REDIS_EXECUTION_CHANNEL_PREFIX: "sg:executions"
      REDIS_EXECUTION_EVENTS_CHANNEL: "sg:execution:events"
      AUTH_JWT_PUBLIC_KEY_PATH: /run/secrets/jwt_public_key.pem
      AUTH_JWT_ALGORITHM: RS256
      AUTH_JWT_ISSUER: auth_service
      BROKER_SERVICE_BASE_URL: http://${COMPOSE_PROJECT_NAME}_broker_service:8003
      DEFAULT_EXECUTION_STYLE: AGGRESSIVE
      PASSIVE_LIMIT_BAND_BPS: 15
      ORDER_VALIDITY: DAY
      POST_SUBMIT_POLL_INTERVAL_SECONDS: 2
      POST_SUBMIT_POLL_TIMEOUT_SECONDS: 60
      RECONCILIATION_INTERVAL_SECONDS: 30
      HOLD_SWEEP_INTERVAL_SECONDS: 15
      HOLD_MAX_AGE_SECONDS: 900
      IDEMPOTENCY_KEY_TTL_SECONDS: 86400
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      OTEL_SERVICE_NAME: execution_engine_service
    secrets:
      - source: auth_public_key
        target: jwt_public_key.pem
    ports: ["127.0.0.1:8008:8008"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      auth_service: { condition: service_healthy }
      broker_service: { condition: service_healthy }
      risk_engine_service: { condition: service_healthy }
    healthcheck:
      <<: *py-healthcheck
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8008/health')"]

  portfolio_management_service:
    <<: *service-defaults
    build: { context: ../.., dockerfile: portfolio_management_service/Dockerfile }
    image: sg/portfolio_management_service:${VERSION:-latest}
    container_name: ${COMPOSE_PROJECT_NAME}_portfolio_management_service
    environment:
      ENV: ${SERVICE_ENV:-production}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      SERVICE_PORT: "8009"
      DATABASE_URL: postgresql://${POSTGRES_USER:-sg_user}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-sg_db}
      DB_POOL_MIN_SIZE: 5
      DB_POOL_MAX_SIZE: 20
