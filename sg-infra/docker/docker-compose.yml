      DEFAULT_INITIAL_CAPITAL_INR: ${PAPER_INITIAL_CAPITAL_INR:-1000000}
      DEFAULT_COMMISSION_BPS: 3
      DEFAULT_SLIPPAGE_BPS: 5
      BENCHMARK_SYMBOL: ${PRIMARY_SYMBOL:-NIFTY50}
      MONTE_CARLO_DEFAULT_ITERATIONS: 2000
      HTTP_CLIENT_TIMEOUT_SECONDS: 15
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      OTEL_SERVICE_NAME: backtesting_engine_service
    secrets:
      - source: auth_public_key
        target: jwt_public_key.pem
    ports: ["127.0.0.1:8010:8010"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      auth_service: { condition: service_healthy }
      market_data_service: { condition: service_healthy }
    healthcheck:
      <<: *py-healthcheck
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8010/health')"]

  ml_platform_service:
    <<: *service-defaults
    build: { context: ../.., dockerfile: ml_platform_service/Dockerfile }
    image: sg/ml_platform_service:${VERSION:-latest}
    container_name: ${COMPOSE_PROJECT_NAME}_ml_platform_service
    environment:
      ENV: ${SERVICE_ENV:-production}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      SERVICE_PORT: "8011"
      DATABASE_URL: postgresql://${POSTGRES_USER:-sg_user}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-sg_db}
      DB_POOL_MIN_SIZE: 3
      DB_POOL_MAX_SIZE: 10
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/10
      REDIS_CANDLE_PATTERN: "sg:market:candle:*"
      REDIS_ML_SIGNALS_CHANNEL_PREFIX: "sg:ml:signals"
      REDIS_ML_REGIME_CHANNEL_PREFIX: "sg:ml:regime"
      MARKET_DATA_SERVICE_URL: http://${COMPOSE_PROJECT_NAME}_market_data_service:8002
      PORTFOLIO_MANAGEMENT_SERVICE_URL: http://${COMPOSE_PROJECT_NAME}_portfolio_management_service:8009
      AUTH_JWT_PUBLIC_KEY_PATH: /run/secrets/jwt_public_key.pem
      AUTH_JWT_ALGORITHM: RS256
      AUTH_JWT_ISSUER: auth_service
      FEATURE_LOOKBACK_BARS: 500
      FEATURE_CACHE_TTL_SECONDS: 30
      TRAIN_SCHEDULE_CRON: "0 18 * * 1-5"
      TRAIN_MIN_SAMPLES: 1000
      TRAIN_TEST_SPLIT: 0.2
      TRAIN_VALIDATION_SPLIT: 0.1
      PREDICTION_CACHE_TTL_SECONDS: 60
      SERVING_CONFIDENCE_THRESHOLD: 0.55
      MODEL_ARTIFACTS_PATH: /var/ml_platform/models
      MODEL_CHAMPION_AUTO_PROMOTE: "true"
      MLFLOW_TRACKING_URI: http://mlflow:5000
      MLFLOW_EXPERIMENT_NAME: sg_trading
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      OTEL_SERVICE_NAME: ml_platform_service
    secrets:
      - source: auth_public_key
        target: jwt_public_key.pem
    ports: ["127.0.0.1:8011:8011"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      auth_service: { condition: service_healthy }
      market_data_service: { condition: service_healthy }
      mlflow: { condition: service_started }
    healthcheck:
      <<: *py-healthcheck
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8011/health')"]

  ai_analyst_service:
    <<: *service-defaults
    build: { context: ../.., dockerfile: ai_analyst_service/Dockerfile }
    image: sg/ai_analyst_service:${VERSION:-latest}
    container_name: ${COMPOSE_PROJECT_NAME}_ai_analyst_service
    environment:
      ENV: ${SERVICE_ENV:-production}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      PORT: "8012"
      DATABASE_URL: postgresql://${POSTGRES_USER:-sg_user}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-sg_db}
      DB_POOL_MIN_SIZE: 5
      DB_POOL_MAX_SIZE: 20
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/11
      AUTH_JWT_PUBLIC_KEY_PATH: /run/secrets/jwt_public_key.pem
      AUTH_JWT_ALGORITHM: RS256
      AUTH_JWT_ISSUER: auth_service
      MARKET_DATA_SERVICE_URL: http://${COMPOSE_PROJECT_NAME}_market_data_service:8002
      RISK_ENGINE_SERVICE_URL: http://${COMPOSE_PROJECT_NAME}_risk_engine_service:8007
      EXECUTION_ENGINE_SERVICE_URL: http://${COMPOSE_PROJECT_NAME}_execution_engine_service:8008
      PORTFOLIO_MANAGEMENT_SERVICE_URL: http://${COMPOSE_PROJECT_NAME}_portfolio_management_service:8009
      HTTP_CLIENT_TIMEOUT_SECONDS: 15
      LLM_PROVIDER: anthropic
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_BASE_URL: https://api.anthropic.com
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-sonnet-4-6}
      ANTHROPIC_API_VERSION: "2023-06-01"
      LLM_MAX_TOKENS: 1024
      LLM_TEMPERATURE: 0.3
      LLM_REQUEST_TIMEOUT_SECONDS: 30
      LLM_MAX_RETRIES: 3
      CACHE_ENABLED: "true"
      CACHE_TTL_SECONDS_DEFAULT: 300
      CACHE_TTL_SECONDS_MARKET_SUMMARY: 120
      CACHE_TTL_SECONDS_PORTFOLIO_REVIEW: 180
      RATE_LIMIT_ENABLED: "true"
      RATE_LIMIT_PER_USER_PER_MINUTE: 10
      RATE_LIMIT_GLOBAL_PER_MINUTE: 120
      MAX_CONTEXT_CHARS: 12000
      MAX_USER_NOTE_CHARS: 500
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      OTEL_SERVICE_NAME: ai_analyst_service
    secrets:
      - source: auth_public_key
        target: jwt_public_key.pem
    ports: ["127.0.0.1:8012:8012"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      auth_service: { condition: service_healthy }
    healthcheck:
      <<: *py-healthcheck
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8012/health')"]

  # signal_aggregation_service — port resolved from source as 8006, which
  # COLLIDES with execution_orchestrator_service (also 8006, confirmed via
  # both services' .env.example AND their Dockerfile EXPOSE/HEALTHCHECK
  # lines). Two containers cannot both publish host port 8006. Re-homed to
  # 8013 (next free slot after ai_analyst_service/8012) via SERVICE_PORT
  # override — the app reads its own bind port from this env var
  # (app/config.py: SERVICE_PORT: int = 8006 default), so no code change is
  # needed, only this env override. See docs/DEPLOYMENT_NOTES.md "Port
  # conflict" for detail and the alternative (renumber
  # execution_orchestrator_service instead) if you'd rather keep
  # signal_aggregation_service's port literally matching its own repo.
  signal_aggregation_service:
    <<: *service-defaults
    build: { context: ../.., dockerfile: signal_aggregation_service/Dockerfile }
    image: sg/signal_aggregation_service:${VERSION:-latest}
    container_name: ${COMPOSE_PROJECT_NAME}_signal_aggregation_service
    environment:
      SERVICE_NAME: signal_aggregation_service
      SERVICE_PORT: "8013"
      ENV: ${SERVICE_ENV:-production}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      DEFAULT_TENANT_ID: ${DEFAULT_TENANT_ID:-00000000-0000-0000-0000-000000000001}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-sg_user}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-sg_db}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/12
      DEFAULT_TIMEFRAME: ${DEFAULT_TIMEFRAME:-5m}
      PRIMARY_SYMBOL: ${PRIMARY_SYMBOL:-NIFTY50}
      WATCHLIST_SYMBOLS: ${WATCHLIST_SYMBOLS:-RELIANCE,HDFCBANK,ICICIBANK,INFY,TCS,TATAMOTORS,SBIN,ITC,LT,AXISBANK}
      STRATEGY_REGISTRY: trend_following,mean_reversion,breakout,momentum,ml_prediction,rsi
      BUY_THRESHOLD: 0.20
      SELL_THRESHOLD: -0.20
      MIN_STRATEGIES_REQUIRED: 2
      MIN_INDIVIDUAL_CONFIDENCE_FOR_CONTRIBUTOR: 0.50
      SIGNAL_STALENESS_SECONDS: 900
      DEFAULT_UNMAPPED_STRATEGY_WEIGHT: 0.05
      AGREEMENT_DAMPENING_FLOOR: 0.5
      RECALC_INTERVAL_SECONDS: 300
      STALE_AFTER_SECONDS: 600
      WEIGHT_CACHE_TTL_SECONDS: 60
      AUTH_REQUIRED: "true"
      JWT_PUBLIC_KEY_PATH: /run/secrets/auth_public_key.pem
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      OTEL_SERVICE_NAME: signal_aggregation_service
    secrets:
      - source: auth_public_key
        target: auth_public_key.pem
    ports: ["127.0.0.1:8013:8013"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      auth_service: { condition: service_healthy }
      regime_detection_service: { condition: service_started }
      strategy_service: { condition: service_started }
    healthcheck:
      <<: *py-healthcheck
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8013/health')"]

  # ═══════════════════════════════════════════════════════════════════════
  # FRONTEND
  # ═══════════════════════════════════════════════════════════════════════

  dashboard:
    <<: *service-defaults
    build: { context: ../.., dockerfile: sg-dashboard/Dockerfile }
    image: sg/dashboard:${VERSION:-latest}
    container_name: ${COMPOSE_PROJECT_NAME}_dashboard
    environment:
      NODE_ENV: production
      AUTH_SERVICE_URL: http://${COMPOSE_PROJECT_NAME}_auth_service:8001
      MARKET_DATA_SERVICE_URL: http://${COMPOSE_PROJECT_NAME}_market_data_service:8002
      BROKER_SERVICE_URL: http://${COMPOSE_PROJECT_NAME}_broker_service:8003
      STRATEGY_SERVICE_URL: http://${COMPOSE_PROJECT_NAME}_strategy_service:8004
      REGIME_SERVICE_URL: http://${COMPOSE_PROJECT_NAME}_regime_detection_service:8005
      ORCHESTRATOR_SERVICE_URL: http://${COMPOSE_PROJECT_NAME}_execution_orchestrator_service:8006
      RISK_ENGINE_URL: http://${COMPOSE_PROJECT_NAME}_risk_engine_service:8007
      EXECUTION_ENGINE_URL: http://${COMPOSE_PROJECT_NAME}_execution_engine_service:8008
      PORTFOLIO_SERVICE_URL: http://${COMPOSE_PROJECT_NAME}_portfolio_management_service:8009
      BACKTESTING_SERVICE_URL: http://${COMPOSE_PROJECT_NAME}_backtesting_engine_service:8010
      ML_PLATFORM_URL: http://${COMPOSE_PROJECT_NAME}_ml_platform_service:8011
      AI_ANALYST_URL: http://${COMPOSE_PROJECT_NAME}_ai_analyst_service:8012
      SIGNAL_AGGREGATION_URL: http://${COMPOSE_PROJECT_NAME}_signal_aggregation_service:8013
      SESSION_SECRET: ${SESSION_SECRET:?SESSION_SECRET required}
      JWT_PUBLIC_KEY: ${JWT_PUBLIC_KEY}
      NEXT_PUBLIC_APP_NAME: "SG Trading"
      NEXT_PUBLIC_APP_ENV: ${SERVICE_ENV:-production}
      NEXT_PUBLIC_SSE_BASE_URL: http://localhost
    expose: ["3000"]
    depends_on:
      auth_service: { condition: service_healthy }
    healthcheck:
      <<: *py-healthcheck
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/"]

  # ═══════════════════════════════════════════════════════════════════════
  # REVERSE PROXY (singleton — see nginx/conf.d/00-upstreams.conf, which
  # blue_green_deploy.sh regenerates on every slot switch)
  # ═══════════════════════════════════════════════════════════════════════

  nginx:
    <<: *service-defaults
    image: nginx:1.27-alpine
    container_name: sg_nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
    depends_on:
      dashboard: { condition: service_healthy }
    healthcheck:
      <<: *py-healthcheck
      test: ["CMD", "nginx", "-t"]
      start_period: 10s

  # ═══════════════════════════════════════════════════════════════════════
  # OBSERVABILITY (merged in from observability_service/ — singleton,
  # not duplicated, per the spec. Configs/versions are read verbatim from
  # that already-delivered, already-tested stack; only the network model
  # changes, collapsing its two networks into the platform's single
  # sg_network per requirement #1.)
  # ═══════════════════════════════════════════════════════════════════════

  prometheus:
    <<: *service-defaults
    image: prom/prometheus:v2.55.1
    container_name: sg_prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=${PROMETHEUS_RETENTION:-30d}
      - --web.enable-lifecycle
      - --web.enable-remote-write-receiver
    volumes:
      - ../../observability_service/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ../../observability_service/prometheus/rules:/etc/prometheus/rules:ro
      - prometheus_data:/prometheus
    ports: ["127.0.0.1:9090:9090"]
    healthcheck:
      <<: *py-healthcheck
      test: ["CMD", "wget", "-qO-", "http://localhost:9090/-/healthy"]
      start_period: 15s

  node-exporter:
    <<: *service-defaults
    image: prom/node-exporter:v1.8.2
    container_name: sg_node_exporter
    pid: host
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - --path.procfs=/host/proc
      - --path.sysfs=/host/sys
      - --collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)

  cadvisor:
    <<: *service-defaults
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    container_name: sg_cadvisor
    privileged: true
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro

  postgres-exporter:
    <<: *service-defaults
    image: prometheuscommunity/postgres-exporter:v0.15.0
    container_name: sg_postgres_exporter
    environment:
      DATA_SOURCE_NAME: ${DATA_SOURCE_NAME:?Set DATA_SOURCE_NAME in .env (read-only Postgres role -- see docs)}
    depends_on:
      postgres: { condition: service_healthy }

  redis-exporter:
    <<: *service-defaults
    image: oliver006/redis_exporter:v1.62.0
    container_name: sg_redis_exporter
    environment:
      REDIS_ADDR: ${REDIS_ADDR:-redis://redis:6379}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    depends_on:
      redis: { condition: service_healthy }

  alertmanager:
    <<: *service-defaults
    image: prom/alertmanager:v0.27.0
    container_name: sg_alertmanager
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
    volumes:
      - ../../observability_service/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager_data:/alertmanager
    ports: ["127.0.0.1:9093:9093"]

  alertmanager-telegram-bot:
    <<: *service-defaults
    image: metalmatze/alertmanager-bot:0.4.3
    container_name: sg_alertmanager_telegram_bot
    environment:
      ALERTMANAGER_URL: http://alertmanager:9093
      BOLT_PATH: /data/bot.db
      STORE: bolt
      TELEGRAM_ADMIN: ${TELEGRAM_CHAT_ID:-}
      TELEGRAM_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
    volumes:
      - alertmanager_data:/data
    depends_on: [alertmanager]

  tempo:
    <<: *service-defaults
    image: grafana/tempo:2.6.1
    container_name: sg_tempo
    command: ["-config.file=/etc/tempo/tempo.yaml"]
    volumes:
      - ../../observability_service/tempo/tempo.yaml:/etc/tempo/tempo.yaml:ro
      - tempo_data:/var/tempo

  otel-collector:
    <<: *service-defaults
    image: otel/opentelemetry-collector-contrib:0.110.0
    container_name: sg_otel_collector
    command: ["--config=/etc/otel-collector-config.yml"]
    volumes:
      - ../../observability_service/otel-collector/otel-collector-config.yml:/etc/otel-collector-config.yml:ro
    ports:
      - "127.0.0.1:4317:4317"
      - "127.0.0.1:4318:4318"
      - "127.0.0.1:8888:8888"
      - "127.0.0.1:8889:8889"
    depends_on: [tempo]

  loki:
    <<: *service-defaults
    image: grafana/loki:3.2.1
    container_name: sg_loki
    command: ["-config.file=/etc/loki/loki-config.yaml"]
    volumes:
      - ../../observability_service/loki/loki-config.yaml:/etc/loki/loki-config.yaml:ro
      - loki_data:/loki

  promtail:
    <<: *service-defaults
    image: grafana/promtail:3.2.1
    container_name: sg_promtail
    command: ["-config.file=/etc/promtail/promtail-config.yaml"]
    volumes:
      - ../../observability_service/promtail/promtail-config.yaml:/etc/promtail/promtail-config.yaml:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on: [loki]

  grafana:
    <<: *service-defaults
    image: grafana/grafana:11.3.0
    container_name: sg_grafana
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:?Set GRAFANA_PASSWORD in .env}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_FEATURE_TOGGLES_ENABLE: traceqlEditor
      GF_SERVER_ROOT_URL: http://localhost/grafana
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
    volumes:
      - ../../observability_service/grafana/provisioning:/etc/grafana/provisioning:ro
      - ../../observability_service/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    # Exception per requirement #6 — exposed beyond localhost, same as nginx:80.
    ports: ["3001:3000"]
    depends_on: [prometheus, loki, tempo]
    healthcheck:
      <<: *py-healthcheck
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]
      start_period: 20s

secrets:
  auth_public_key:
    file: ${AUTH_PUBLIC_KEY_FILE:-./secrets/auth_public_key.pem}
