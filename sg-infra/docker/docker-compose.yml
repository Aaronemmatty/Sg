      SNAPSHOT_INTERVAL_SECONDS: 60
      BENCHMARK_SYMBOL: ${PRIMARY_SYMBOL:-NIFTY50}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
