# Location blocks only. Upstream *definitions* live in 00-upstreams.conf
# (loaded first — see the numeric prefix — and rewritten in place by
# scripts/blue_green_deploy.sh on every slot switch). Keeping them split
# this way means a blue/green traffic flip never has to touch this file.

server {
    listen 80;
    server_name localhost _;

    # ── Dashboard (Next.js) ─────────────────────────────────────
    location / {
        proxy_pass http://dashboard;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 60s;
    }

    # ── SSE streams — direct passthrough, no buffering ─────────
    location /sse/portfolio {
        proxy_pass http://portfolio_svc/api/v1/portfolio/stream;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_set_header Authorization $http_authorization;
        proxy_read_timeout 3600s;
        proxy_buffering off;
        proxy_cache off;
        add_header X-Accel-Buffering no;
        add_header Cache-Control no-cache;
    }

    location /sse/risk {
        proxy_pass http://risk_svc/api/v1/risk/stream;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_set_header Authorization $http_authorization;
        proxy_read_timeout 3600s;
        proxy_buffering off;
        proxy_cache off;
        add_header X-Accel-Buffering no;
        add_header Cache-Control no-cache;
    }

    location /sse/execution {
        proxy_pass http://execution_svc/api/v1/execution/stream;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_set_header Authorization $http_authorization;
        proxy_read_timeout 3600s;
        proxy_buffering off;
        proxy_cache off;
        add_header X-Accel-Buffering no;
        add_header Cache-Control no-cache;
    }

    # ── Grafana (also reachable directly on :3001 per requirement #6) ──
    location /grafana/ {
        proxy_pass http://grafana/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        rewrite ^/grafana/(.*)$ /$1 break;
    }

    # ── MLflow ──────────────────────────────────────────────────
    location /mlflow/ {
        proxy_pass http://mlflow/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        rewrite ^/mlflow/(.*)$ /$1 break;
    }

    # ── Health endpoint ─────────────────────────────────────────
    location /nginx-health {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }
}
