# PostgreSQL config tuned for SG Trading on a laptop
# Assumes: 8–16GB RAM, SSD, single user

# ─── Connections ─────────────────────────────────────────────────
max_connections = 100               # 13 services × ~5 pool connections
superuser_reserved_connections = 3

# ─── Memory ──────────────────────────────────────────────────────
shared_buffers = 512MB              # 25% of available RAM (adjust for your machine)
effective_cache_size = 2GB          # 50-75% of RAM
work_mem = 16MB                     # per sort/hash operation
maintenance_work_mem = 128MB        # VACUUM, CREATE INDEX etc.
wal_buffers = 16MB

# ─── Checkpointing ───────────────────────────────────────────────
checkpoint_completion_target = 0.9
max_wal_size = 1GB
min_wal_size = 80MB

# ─── Query planner ───────────────────────────────────────────────
random_page_cost = 1.1              # SSD — lower than default 4.0
effective_io_concurrency = 200      # SSD concurrent I/O

# ─── Logging ─────────────────────────────────────────────────────
log_min_duration_statement = 500    # Log queries slower than 500ms
log_line_prefix = '%t [%p]: [%l-1] user=%u,db=%d,app=%a '
log_checkpoints = on
log_connections = off               # Too noisy in production
log_disconnections = off
log_lock_waits = on
log_temp_files = 0

# ─── Auto-vacuum ─────────────────────────────────────────────────
autovacuum = on
autovacuum_max_workers = 3
autovacuum_naptime = 30s

# ─── Timezone ────────────────────────────────────────────────────
timezone = 'Asia/Kolkata'
log_timezone = 'Asia/Kolkata'
