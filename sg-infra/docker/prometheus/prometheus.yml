global:
  scrape_interval:     15s
  evaluation_interval: 15s
  external_labels:
    platform: sg_trading
    env: production

rule_files:
  - /etc/prometheus/rules/*.yml

alerting:
  alertmanagers: []   # add alertmanager config here when ready

scrape_configs:

  # ─── Infrastructure ──────────────────────────────────────────
  - job_name: postgres
    static_configs:
      - targets: ['postgres:9187']   # postgres_exporter sidecar

  - job_name: redis
    static_configs:
      - targets: ['redis:9121']      # redis_exporter sidecar

  # ─── Platform Services ───────────────────────────────────────
  - job_name: auth_service
    static_configs:
      - targets: ['auth_service:8001']
    metrics_path: /metrics

  - job_name: market_data_service
    static_configs:
      - targets: ['market_data_service:8002']
    metrics_path: /metrics

  - job_name: broker_service
    static_configs:
      - targets: ['broker_service:8003']
    metrics_path: /metrics

  - job_name: strategy_service
    static_configs:
      - targets: ['strategy_service:8004']
    metrics_path: /metrics

  - job_name: regime_detection_service
    static_configs:
      - targets: ['regime_detection_service:8005']
    metrics_path: /metrics

  - job_name: execution_orchestrator_service
    static_configs:
      - targets: ['execution_orchestrator_service:8006']
    metrics_path: /metrics

  - job_name: risk_engine_service
    static_configs:
      - targets: ['risk_engine_service:8007']
    metrics_path: /metrics

  - job_name: execution_engine_service
    static_configs:
      - targets: ['execution_engine_service:8008']
    metrics_path: /metrics

  - job_name: portfolio_management_service
    static_configs:
      - targets: ['portfolio_management_service:8009']
    metrics_path: /metrics

  - job_name: backtesting_engine
    static_configs:
      - targets: ['backtesting_engine:8010']
    metrics_path: /metrics

  - job_name: ml_platform_service
    static_configs:
      - targets: ['ml_platform_service:8011']
    metrics_path: /metrics

  - job_name: ai_analyst_service
    static_configs:
      - targets: ['ai_analyst_service:8012']
    metrics_path: /metrics

  - job_name: prometheus_self
    static_configs:
      - targets: ['localhost:9090']
