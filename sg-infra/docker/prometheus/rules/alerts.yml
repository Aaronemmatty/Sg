groups:
  # ─── Service availability ─────────────────────────────────────
  - name: service_availability
    rules:
      - alert: ServiceDown
        expr: up == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Service {{ $labels.job }} is DOWN"
          description: "{{ $labels.job }} has been unreachable for 1 minute."

      - alert: HighErrorRate
        expr: |
          rate(http_requests_total{status=~"5.."}[5m])
          / rate(http_requests_total[5m]) > 0.05
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "High error rate on {{ $labels.job }}"
          description: "Error rate is {{ $value | humanizePercentage }} over 5 minutes."

      - alert: HighLatency
        expr: |
          histogram_quantile(0.95,
            rate(http_request_duration_seconds_bucket[5m])
          ) > 2
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High p95 latency on {{ $labels.job }}"
          description: "p95 latency is {{ $value | humanizeDuration }}."

  # ─── Trading-specific ─────────────────────────────────────────
  - name: trading
    rules:
      - alert: CircuitBreakerActive
        expr: sg_circuit_breaker_active == 1
        for: 0m
        labels:
          severity: critical
        annotations:
          summary: "Circuit breaker is ACTIVE — order routing suspended"

      - alert: DailyLossLimitBreached
        expr: |
          sg_daily_loss_used_inr / sg_daily_loss_limit_inr > 0.8
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "Daily loss limit {{ $value | humanizePercentage }} used"

      - alert: PortfolioDrawdownHigh
        expr: sg_current_drawdown_pct > 8
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Portfolio drawdown {{ $value }}% — approaching limit"

      - alert: MLDriftDetected
        expr: sg_ml_feature_psi_max > 0.2
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: "ML feature drift detected (PSI {{ $value }})"
          description: "Model {{ $labels.model_id }} on {{ $labels.symbol }} has drifted."

      - alert: TrainingJobFailed
        expr: sg_training_job_failed_total > 0
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: "ML training job failed"

  # ─── Infrastructure ───────────────────────────────────────────
  - name: infrastructure
    rules:
      - alert: PostgresDown
        expr: pg_up == 0
        for: 30s
        labels:
          severity: critical
        annotations:
          summary: "PostgreSQL is DOWN — all services affected"

      - alert: RedisDown
        expr: redis_up == 0
        for: 30s
        labels:
          severity: critical
        annotations:
          summary: "Redis is DOWN — pub/sub and caching offline"

      - alert: PostgresConnectionsHigh
        expr: pg_stat_activity_count > 80
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "PostgreSQL connections high ({{ $value }})"

      - alert: DiskSpaceLow
        expr: |
          (node_filesystem_avail_bytes{mountpoint="/"} /
           node_filesystem_size_bytes{mountpoint="/"}) < 0.15
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Low disk space — {{ $value | humanizePercentage }} free"
