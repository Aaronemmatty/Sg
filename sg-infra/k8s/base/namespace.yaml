# ═══════════════════════════════════════════════════════════════════
# SG Trading — Kubernetes Base Manifests (k3s)
# ═══════════════════════════════════════════════════════════════════
# TIER 2 — Use when you're ready to graduate from Docker Compose.
# Install k3s: curl -sfL https://get.k3s.io | sh -
# Apply:       kubectl apply -k k8s/overlays/dev
# ═══════════════════════════════════════════════════════════════════

apiVersion: v1
kind: Namespace
metadata:
  name: sg-trading
  labels:
    app.kubernetes.io/managed-by: kubectl
    environment: production

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: platform-config
  namespace: sg-trading
data:
  # Service discovery — all services talk via k8s DNS
  AUTH_SERVICE_URL:        "http://auth-service:8001"
  MARKET_DATA_SERVICE_URL: "http://market-data-service:8002"
  BROKER_SERVICE_URL:      "http://broker-service:8003"
  STRATEGY_SERVICE_URL:    "http://strategy-service:8004"
  REGIME_SERVICE_URL:      "http://regime-detection-service:8005"
  ORCHESTRATOR_SERVICE_URL:"http://execution-orchestrator-service:8006"
  RISK_ENGINE_URL:         "http://risk-engine-service:8007"
  EXECUTION_ENGINE_URL:    "http://execution-engine-service:8008"
  PORTFOLIO_SERVICE_URL:   "http://portfolio-management-service:8009"
  BACKTESTING_SERVICE_URL: "http://backtesting-engine:8010"
  ML_PLATFORM_URL:         "http://ml-platform-service:8011"
  AI_ANALYST_URL:          "http://ai-analyst-service:8012"
  MLFLOW_TRACKING_URI:     "http://mlflow:5000"
  SERVICE_ENV:             "production"
