# Merge this service block into the platform's root docker-compose.yml.
services:
  signal_aggregation_service:
    build:
      context: ./signal_aggregation_service
      dockerfile: Dockerfile
    image: sg-trading/signal_aggregation_service:latest
    container_name: signal_aggregation_service
    ports:
      - "8006:8006"
    environment:
      SERVICE_NAME: signal_aggregation_service
      SERVICE_PORT: 8006
      ENV: ${ENV:-dev}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      DATABASE_URL: postgresql+asyncpg://sg:sg@postgres:5432/sg_db
      REDIS_URL: redis://redis:6379/0
      PRIMARY_SYMBOL: NIFTY50
      DEFAULT_TIMEFRAME: 5m
      AUTH_REQUIRED: "true"
      JWT_PUBLIC_KEY_PATH: /run/secrets/auth_public_key.pem
    secrets:
      - auth_public_key.pem
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      regime_detection_service:
        condition: service_started
      strategy_service:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8006/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped
    networks:
      - sg-net

secrets:
  auth_public_key.pem:
    file: ./secrets/auth_public_key.pem

networks:
  sg-net:
    external: true
