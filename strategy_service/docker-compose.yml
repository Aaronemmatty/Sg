version: "3.9"

services:
  strategy:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    container_name: sg_strategy
    restart: unless-stopped
    ports:
      - "8004:8004"
    environment:
      APP_ENV: development
      DEBUG: "false"
      TRADING_MODE: ${TRADING_MODE:-paper}
      DATABASE_URL: postgresql+asyncpg://sg:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/sg_platform
      REDIS_URL: redis://redis:6379/3
      MARKET_DATA_SERVICE_URL: http://market-data:8002
      USER_STRATEGIES_DIR: /app/strategies
      STRATEGY_EXECUTION_TIMEOUT_S: "5.0"
      STRATEGY_MAX_RESTARTS: "5"
      PROMETHEUS_ENABLED: "true"
      LOG_LEVEL: INFO
    volumes:
      # Mount your custom strategies here — they hot-reload on change
      - ./strategies:/app/strategies
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - sg_network

  postgres:
    image: postgres:17-alpine
    container_name: sg_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: sg
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: sg_platform
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sg -d sg_platform"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - sg_network

  redis:
    image: redis:7-alpine
    container_name: sg_redis
    restart: unless-stopped
    command: redis-server --maxmemory 512mb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - sg_network

volumes:
  pg_data:
  redis_data:

networks:
  sg_network:
    driver: bridge
