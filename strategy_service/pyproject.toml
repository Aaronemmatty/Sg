[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sg-strategy-service"
version = "1.0.0"
description = "SG Trading Platform — Strategy Core Framework"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "sqlalchemy>=2.0.36",
    "alembic>=1.14.0",
    "asyncpg>=0.30.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",
    "redis[hiredis]>=5.2.0",
    "numpy>=2.1.0",
    "pandas>=2.2.0",
    "ta>=0.11.0",
    "apscheduler>=3.10.0",
    "watchfiles>=1.0.0",
    "structlog>=24.4.0",
    "prometheus-fastapi-instrumentator>=7.0.0",
    "opentelemetry-sdk>=1.27.0",
    "opentelemetry-instrumentation-fastapi>=0.48b0",
    "httpx>=0.28.0",
    "PyJWT[crypto]>=2.8.0",
    "pytz>=2024.1",
    "sg-db",
    "sg-security",
]

[project.optional-dependencies]
ml = [
    "scikit-learn==1.6.0",
    "joblib==1.4.2",
]
dev = [
    "pytest==8.3.4",
    "pytest-asyncio==0.24.0",
    "pytest-cov==6.0.0",
    "httpx==0.28.1",
    "freezegun==1.5.1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--cov=app --cov-report=term-missing --cov-fail-under=80"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.hatch.metadata]
allow-direct-references = true
